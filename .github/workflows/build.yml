name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -path './.git' -prune -o -path './.opencode' -prune -o -name '*.go' -print))"

      - name: Run vet
        run: go vet -tags "sqlite memory" ./...

      - name: Check architecture boundaries
        run: go test ./tests/ -run TestArch -count=1 -v

      - name: Check docs structure
        run: go run ./scripts/doccheck

      # 新鲜度门禁：生成物必须与提交版本一致。
      # 改了代码却忘了重跑 `make gen`，这里会失败。
      # 注意：生成器必须完全可复现，否则本步骤会永久失败。两条已落实的约束：
      #   1) 不输出生成时间戳（否则每次运行都变）；
      #   2) 不写入覆盖率数字——`go test -cover` 对含并发的包不可复现，
      #      故 `make stats` 固定带 `-no-cover`，覆盖率另见 `make coverage`（不写文件）。
      - name: Check generated docs are fresh
        run: |
          make gen
          git diff --exit-code docs/DEPGRAPH.md docs/STATS.md

      - name: Run race tests
        run: go test -tags "sqlite memory" -race -count=1 ./pkg/... ./internal/permission ./internal/tui ./cmd/basework

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -tags "sqlite memory" -count=1 ./...

      - name: Build binary
        run: go build -tags "sqlite memory" ./cmd/basework

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --snapshot --clean --skip=docker,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
