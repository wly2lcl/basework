name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -path './.git' -prune -o -path './.opencode' -prune -o -name '*.go' -print))"

      # Keep the default (no build tags) configuration under a continuous
      # full-suite gate as well as the sqlite/memory configuration below.
      - name: Run default tests
        run: go test -count=1 ./...

      - name: Run project load gate
        run: go test ./tests/load -run TestProjectLoad -count=1 -timeout 10m -v

      - name: Run vet
        run: go vet -tags "sqlite memory" ./...

      - name: Check architecture boundaries
        run: go test ./tests/ -run TestArch -count=1 -v

      - name: Check docs structure
        run: go run ./scripts/doccheck

      # 新鲜度门禁：生成物必须与提交版本一致。
      # 改了代码却忘了重跑 `make gen`，这里会失败。
      # 注意：生成器必须完全可复现，否则本步骤会永久失败。两条已落实的约束：
      #   1) 不输出生成时间戳（否则每次运行都变）；
      #   2) 不写入覆盖率数字——`go test -cover` 对含并发的包不可复现，
      #      故 `make stats` 固定带 `-no-cover`，覆盖率另见 `make coverage`（不写文件）。
      - name: Check generated docs are fresh
        run: |
          make gen
          git diff --exit-code docs/DEPGRAPH.md docs/STATS.md

      - name: Run race tests
        run: go test -tags "sqlite memory" -race -count=1 ./pkg/... ./internal/permission ./internal/tui ./cmd/basework ./internal/runtime ./internal/jobs ./internal/edits ./tests/load

      # 至少保留一个真实入口烟测：脚本会从当前 checkout 构建二进制，
      # 在临时 HOME、临时 fixtures 和本地回环假服务中跑完整修复流程。
      - name: Run Unix PTY smoke scenario
        run: python3 tests/tui_pty/scenario1.py

      # 覆盖 init 的真实终端交互；非交互路径的 stdin 边界由 Go 单测覆盖。
      - name: Run OPT-001 PTY init smoke
        run: python3 tests/opt_pty_init.py

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_goos: linux
            expected_goarch: amd64
          - os: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - os: macos-latest
            expected_goos: darwin
            expected_goarch: arm64
          - os: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - os: windows-latest
            expected_goos: windows
            expected_goarch: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -tags "sqlite memory" -count=1 ./...

      - name: Build binary
        run: go build -tags "sqlite memory" ./cmd/basework

      - name: Run Windows path boundary tests
        if: matrix.os == 'windows-latest'
        run: go test -tags "sqlite memory" ./pkg/agent ./cmd/basework -run "TestFactsSummaryProvider_RejectsWindows|TestFactsHashFunc_RejectsSymlinkOutsideWorkspace" -count=1 -v

  release-artifact-smoke:
    name: Release Artifact Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_goos: linux
            expected_goarch: amd64
          - os: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - os: macos-latest
            expected_goos: darwin
            expected_goarch: arm64
          - os: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - os: windows-latest
            expected_goos: windows
            expected_goarch: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --snapshot --clean --skip=docker,publish --parallelism=1

      - name: Run packaged artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          goos="$(go env GOOS)"
          goarch="$(go env GOARCH)"
          test "$goos" = "${{ matrix.expected_goos }}"
          test "$goarch" = "${{ matrix.expected_goarch }}"
          case "$goos" in
            darwin) os_name="Darwin" ;;
            linux) os_name="Linux" ;;
            *) echo "unsupported Unix GOOS: $goos" >&2; exit 1 ;;
          esac
          case "$goarch" in
            amd64) arch_name="x86_64" ;;
            arm64) arch_name="arm64" ;;
            *) echo "unsupported Unix GOARCH: $goarch" >&2; exit 1 ;;
          esac
          artifact="dist/basework_${os_name}_${arch_name}.tar.gz"
          test -f "$artifact"
          echo "runner=$RUNNER_OS goos=$goos goarch=$goarch artifact=$artifact"
          (command -v sha256sum >/dev/null && sha256sum "$artifact") || shasum -a 256 "$artifact"
          install_root="$RUNNER_TEMP/basework-package"
          home_root="$RUNNER_TEMP/basework-home"
          mkdir -p "$install_root" "$home_root"
          tar -xzf "$artifact" -C "$install_root"
          export HOME="$home_root"
          "$install_root/basework" version
          "$install_root/basework" config explain
          "$install_root/basework" init --yes --provider opencode --model release-smoke --force
          test -f "$home_root/.config/basework/config.json"

          # 发布包自身执行一次 v1 JSONL -> SQLite 迁移：校验源文件未被改写、
          # 原会话 ID 可在目标库中看到。详细事件投影仍由同一候选的原生测试覆盖。
          migration_dir="$home_root/.local/share/basework/sessions"
          mkdir -p "$migration_dir"
          cat > "$migration_dir/upgrade-v1.jsonl" <<'EOF'
          {"_schema":"basework.session","v":1}
          {"id":"e-upgrade","session_id":"upgrade-v1","type":"prompted","data":{"content":"release package migration"},"seq":1,"created_at":"2026-09-01T00:00:00Z","v":1}
          EOF
          source_hash_before="$( (command -v sha256sum >/dev/null && sha256sum "$migration_dir/upgrade-v1.jsonl" || shasum -a 256 "$migration_dir/upgrade-v1.jsonl") | awk '{print $1}' )"
          "$install_root/basework" migrate sessions
          source_hash_after="$( (command -v sha256sum >/dev/null && sha256sum "$migration_dir/upgrade-v1.jsonl" || shasum -a 256 "$migration_dir/upgrade-v1.jsonl") | awk '{print $1}' )"
          test "$source_hash_before" = "$source_hash_after"
          status_output="$("$install_root/basework" session status)"
          echo "$status_output"
          grep -F "upgrade-v1" <<<"$status_output"

          # 未来格式必须由发布包拒绝，且失败不能被脚本误判为成功。
          future_home="$RUNNER_TEMP/basework-future-home"
          future_dir="$future_home/.local/share/basework/sessions"
          mkdir -p "$future_dir"
          cat > "$future_dir/future-v99.jsonl" <<'EOF'
          {"_schema":"basework.session","v":99}
          {"id":"e-future","session_id":"future-v99","type":"prompted","data":{"content":"future format"},"seq":1,"created_at":"2026-09-01T00:00:00Z","v":99}
          EOF
          future_log="$RUNNER_TEMP/basework-future.log"
          if HOME="$future_home" "$install_root/basework" migrate sessions >"$future_log" 2>&1; then
            cat "$future_log"
            echo "future schema migration unexpectedly succeeded" >&2
            exit 1
          fi
          cat "$future_log"
          grep -E "失败|过高|v99" "$future_log"
          future_status="$(HOME="$future_home" "$install_root/basework" session status)"
          test -z "$(grep -F "future-v99" <<<"$future_status" || true)"

      - name: Run packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goos = go env GOOS
          $goarch = go env GOARCH
          if ($goos -ne "${{ matrix.expected_goos }}") { throw "unexpected GOOS: $goos" }
          if ($goarch -ne "${{ matrix.expected_goarch }}") { throw "unexpected GOARCH: $goarch" }
          $archName = if ($goarch -eq "amd64") { "x86_64" } elseif ($goarch -eq "arm64") { "arm64" } else { throw "unsupported Windows GOARCH: $goarch" }
          $artifact = "dist/basework_Windows_$archName.zip"
          if (-not (Test-Path $artifact)) { throw "missing artifact: $artifact" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
          Write-Host "runner=$env:RUNNER_OS goos=$goos goarch=$goarch artifact=$artifact sha256=$hash"
          $installRoot = Join-Path $env:RUNNER_TEMP "basework-package"
          $homeRoot = Join-Path $env:RUNNER_TEMP "basework-home"
          New-Item -ItemType Directory -Force -Path $installRoot, $homeRoot | Out-Null
          Expand-Archive -Path $artifact -DestinationPath $installRoot -Force
          $env:HOME = $homeRoot
          $env:USERPROFILE = $homeRoot
          & (Join-Path $installRoot "basework.exe") version
          & (Join-Path $installRoot "basework.exe") config explain
          & (Join-Path $installRoot "basework.exe") init --yes --provider opencode --model release-smoke --force
          if (-not (Test-Path (Join-Path $homeRoot ".config/basework/config.json"))) { throw "init did not create config" }

          # 发布包自身执行一次 v1 JSONL -> SQLite 迁移，并确认源文件哈希保持不变。
          $migrationDir = Join-Path $homeRoot ".local/share/basework/sessions"
          New-Item -ItemType Directory -Force -Path $migrationDir | Out-Null
          $fixture = Join-Path $migrationDir "upgrade-v1.jsonl"
          @'
          {"_schema":"basework.session","v":1}
          {"id":"e-upgrade","session_id":"upgrade-v1","type":"prompted","data":{"content":"release package migration"},"seq":1,"created_at":"2026-09-01T00:00:00Z","v":1}
          '@ | Set-Content -Path $fixture -NoNewline -Encoding utf8
          $sourceHashBefore = (Get-FileHash -Algorithm SHA256 -Path $fixture).Hash
          & (Join-Path $installRoot "basework.exe") migrate sessions
          if ($LASTEXITCODE -ne 0) { throw "packaged migration failed with exit code $LASTEXITCODE" }
          $sourceHashAfter = (Get-FileHash -Algorithm SHA256 -Path $fixture).Hash
          if ($sourceHashBefore -ne $sourceHashAfter) { throw "migration rewrote source JSONL" }
          $statusOutput = (& (Join-Path $installRoot "basework.exe") session status | Out-String)
          Write-Host $statusOutput
          if ($statusOutput -notmatch "upgrade-v1") { throw "migrated session is missing from SQLite status" }

          # 未来格式必须被发布包拒绝，且不留下该会话。
          $futureHome = Join-Path $env:RUNNER_TEMP "basework-future-home"
          $futureDir = Join-Path $futureHome ".local/share/basework/sessions"
          New-Item -ItemType Directory -Force -Path $futureDir | Out-Null
          $futureFixture = Join-Path $futureDir "future-v99.jsonl"
          @'
          {"_schema":"basework.session","v":99}
          {"id":"e-future","session_id":"future-v99","type":"prompted","data":{"content":"future format"},"seq":1,"created_at":"2026-09-01T00:00:00Z","v":99}
          '@ | Set-Content -Path $futureFixture -NoNewline -Encoding utf8
          $futureLog = Join-Path $env:RUNNER_TEMP "basework-future.log"
          $oldHome = $env:HOME
          $oldProfile = $env:USERPROFILE
          $env:HOME = $futureHome
          $env:USERPROFILE = $futureHome
          & (Join-Path $installRoot "basework.exe") migrate sessions *> $futureLog
          $futureExit = $LASTEXITCODE
          $env:HOME = $oldHome
          $env:USERPROFILE = $oldProfile
          Get-Content $futureLog
          if ($futureExit -eq 0) { throw "future schema migration unexpectedly succeeded" }
          if ((Get-Content $futureLog -Raw) -notmatch "失败|过高|v99") { throw "future schema rejection was not reported" }
          $futureStatus = (& { $env:HOME = $futureHome; $env:USERPROFILE = $futureHome; & (Join-Path $installRoot "basework.exe") session status } | Out-String)
          if ($futureStatus -match "future-v99") { throw "future schema session was imported" }

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    needs: [quality, test, release-artifact-smoke]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --snapshot --clean --skip=docker,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: [quality, test, release-artifact-smoke]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate OCI image
        env:
          BASEWORK_VERSION: 0.1.4-ci-${{ github.sha }}
          BASEWORK_BUILD_DATE: 1970-01-01T00:00:00Z
          BASEWORK_DOCKER_SMOKE: "1"
        run: |
          ./scripts/build_docker_candidate.sh \
            "basework:ci-${GITHUB_SHA}" \
            "$RUNNER_TEMP/basework-${GITHUB_SHA}.oci"

      - name: Run amd64 smoke checks
        env:
          IMAGE: basework:ci-${{ github.sha }}-amd64
        run: |
          mkdir -p "$RUNNER_TEMP/basework-docker/config" "$RUNNER_TEMP/basework-docker/data"
          docker run --rm --platform linux/amd64 "$IMAGE" version
          docker run --rm --platform linux/amd64 --read-only -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/basework-docker/config:/root/.config/basework" \
            -v "$RUNNER_TEMP/basework-docker/data:/root/.local/share/basework" \
            "$IMAGE" facts show

      - name: Run arm64 smoke checks
        env:
          IMAGE: basework:ci-${{ github.sha }}-arm64
        run: |
          docker run --rm --platform linux/arm64 "$IMAGE" version
          docker run --rm --platform linux/arm64 --read-only -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/basework-docker/config:/root/.config/basework" \
            -v "$RUNNER_TEMP/basework-docker/data:/root/.local/share/basework" \
            "$IMAGE" facts show
