name: Real Provider Acceptance

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider type (for example openai or openai-compat)"
        required: true
        default: openai
      base_url:
        description: "OpenAI-compatible or provider endpoint"
        required: true
      model:
        description: "Model ID"
        required: true
      repetitions:
        description: "Sequential acceptance repetitions on this exact commit"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"

permissions:
  contents: read

jobs:
  real-provider:
    name: Real Provider Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sequential redacted acceptance repetitions
        env:
          BASEWORK_REAL_PROVIDER: ${{ inputs.provider }}
          BASEWORK_REAL_BASE_URL: ${{ inputs.base_url }}
          BASEWORK_REAL_MODEL: ${{ inputs.model }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          BASEWORK_REAL_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          case "$BASEWORK_REAL_REPETITIONS" in
            1|3) ;;
            *) echo "repetitions must be 1 or 3" >&2; exit 2 ;;
          esac
          for run_number in $(seq 1 "$BASEWORK_REAL_REPETITIONS"); do
            echo "starting real provider acceptance repetition ${run_number}/${BASEWORK_REAL_REPETITIONS}"
            BASEWORK_REAL_OUTPUT="${RUNNER_TEMP}/basework-real-provider-${run_number}.json" \
              go run ./tests/real_provider
          done

      - name: Upload redacted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-provider-result-${{ github.run_id }}
          path: ${{ runner.temp }}/basework-real-provider-*.json
          if-no-files-found: ignore
